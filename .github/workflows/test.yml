name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ".[lint]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
      - run: python -m pytest
      - name: Drive the real window on the Windows desktop
        if: runner.os == 'Windows'
        env:
          BATCH_CROP_GUI_TESTS: "1"
        run: python -m pytest -m gui -v

  gui-linux:
    name: window under Xvfb (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f tests/gui/Dockerfile -t batch-crop-gui .
      - run: docker run --rm batch-crop-gui

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and check the sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a clean environment and crop the demo pictures
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/batch-crop --version
          /tmp/venv/bin/batch-crop -i img/input -o /tmp/out --box 294,172,618,347 --mismatch stretch
          test "$(ls /tmp/out | wc -l)" -eq 3
