<!doctype html>
<!--
  Source of cover.png (1280x640, the GitHub social preview size). Re-render from the repository root:
  msedge --headless=new --disable-gpu --hide-scrollbars --window-size=1280,640 --screenshot=docs/images/cover.png docs/images/cover.html
  The pictures are the demo inputs and the crops the tool wrote from them (docs/demo/record.sh).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>batch-crop cover</title>
<style>
  :root { --accent: #ffc400; --ink: #f4f6f8; --muted: #9aa4ae; --ground: #0f1317; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; background: var(--ground);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: var(--ink);
    display: grid; grid-template-columns: 560px 1fr; align-items: center;
  }
  .text { padding: 0 0 0 72px; }
  .name { font-size: 88px; font-weight: 800; letter-spacing: -2px; line-height: 1; white-space: nowrap; }
  .name span { color: var(--accent); }
  .pitch { margin-top: 26px; font-size: 34px; line-height: 1.25; font-weight: 600; }
  .pitch em { font-style: normal; color: var(--accent); }
  .flags { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 10px; }
  .flags code {
    font: 600 17px/1 Consolas, "Cascadia Mono", monospace; color: var(--ink);
    border: 1px solid #36404a; background: #182028; padding: 9px 12px; border-radius: 6px;
  }
  .scene { position: relative; height: 640px; }
  .stack { position: absolute; left: 0; top: 118px; width: 400px; height: 300px; }
  .shot {
    position: absolute; width: 400px; height: 225px; border-radius: 6px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(0,0,0,.55); background: #000;
  }
  .shot img { width: 100%; height: 100%; object-fit: fill; display: block; filter: brightness(.45); }
  .shot .box {
    position: absolute; left: 22.97%; top: 23.89%; width: 48.28%; height: 48.19%;
    border: 3px solid var(--accent); overflow: hidden;
  }
  .shot .box img { position: absolute; width: 207.1%; height: 207.5%; left: -47.57%; top: -49.57%; filter: none; }
  .shot:nth-child(1) { left: 0; top: 0; transform: rotate(-4deg); }
  .shot:nth-child(2) { left: 22px; top: 52px; transform: rotate(1deg); }
  .shot:nth-child(3) { left: 44px; top: 104px; transform: rotate(4deg); }
  .arrow { position: absolute; left: 434px; top: 268px; width: 64px; height: 40px; }
  .results { position: absolute; left: 514px; top: 100px; display: grid; gap: 16px; }
  .results img {
    width: 168px; height: 95px; object-fit: cover; display: block; border-radius: 4px;
    outline: 3px solid var(--accent); box-shadow: 0 10px 24px rgba(0,0,0,.5);
  }
  .caption { position: absolute; left: 0; bottom: 54px; font-size: 20px; color: var(--muted); }
  .caption b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="text">
    <div class="name">batch<span>-</span>crop</div>
    <p class="pitch">Draw the box once.<br><em>Crop the whole folder.</em></p>
    <div class="flags"><code>--box</code><code>--preset</code><code>--mismatch</code><code>--recursive</code></div>
  </div>
  <div class="scene">
    <div class="stack">
      <div class="shot"><img src="../../img/input/3.jpg" alt=""><div class="box"><img src="../../img/input/3.jpg" alt=""></div></div>
      <div class="shot"><img src="../../img/input/2.jpg" alt=""><div class="box"><img src="../../img/input/2.jpg" alt=""></div></div>
      <div class="shot"><img src="../../img/input/1.jpg" alt=""><div class="box"><img src="../../img/input/1.jpg" alt=""></div></div>
    </div>
    <svg class="arrow" viewBox="0 0 64 40" aria-hidden="true">
      <path d="M2 20 H50 M36 6 L54 20 L36 34" fill="none" stroke="#ffc400" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="results">
      <img src="../../img/result/1.jpg" alt="">
      <img src="../../img/result/2.jpg" alt="">
      <img src="../../img/result/3.jpg" alt="">
    </div>
    <p class="caption"><b>3 pictures</b>, one box, same crop everywhere &mdash; EXIF and colour profiles kept</p>
  </div>
</body>
</html>
